name: render and stage

# Fired by Apps Script the moment a confession is scheduled — not when it is due.
#
# Rendering early is deliberate: a broken render surfaces while someone is still
# looking at the group, and the image has to be sitting on a public URL before
# Apps Script calls Instagram, which fetches the picture rather than accepting
# bytes. Publishing itself no longer happens here — Apps Script does it through
# Composio when the scheduled minute arrives.
on:
  repository_dispatch:
    types: [render]

permissions:
  contents: write          # needed to stage the image on the public media branch

# Two confessions scheduled seconds apart would otherwise both push to `media`
# and one would lose the race.
concurrency:
  group: media-branch
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      # Capture the traceback. A step that just reports "failure" sends you to
      # the Actions log to find out why, which is exactly what the Telegram
      # report exists to avoid.
      - name: Render
        id: render
        env:
          CONFESSION_TEXT: ${{ github.event.client_payload.text }}
        run: |
          set -o pipefail
          python3 make_image.py 2>&1 | tee /tmp/render.log

      # Instagram fetches the picture from a URL, so it has to be reachable
      # without a token. raw.githubusercontent.com serves public repos directly.
      #
      # The branch ACCUMULATES. Posts can be scheduled days ahead, so several
      # images must coexist — the old orphan force-push would have deleted the
      # one waiting for tomorrow while staging the one for Friday.
      - name: Stage image publicly
        id: stage
        env:
          MEDIA_NAME: ${{ github.event.client_payload.media }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MEDIA_NAME" || { echo "no media name in payload"; exit 1; }

          # Staging happens in its own directory, NOT by switching branches in
          # the workspace. Two reasons, both learned the hard way:
          #
          #   * git refuses to check out over untracked files, and the render
          #     leaves post.jpg and __pycache__ behind — so a checkout aborts on
          #     every run after the first.
          #   * the later step needs post.jpg and report.py to still be there.
          #     Switching the workspace to a branch that contains neither takes
          #     them away.
          WORK="${RUNNER_TEMP}/media"
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp post.jpg "$WORK/../$MEDIA_NAME"

          cd "$WORK"
          git init -q
          git config user.name  "vidui-bot"
          git config user.email "vidui-bot@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Start from the existing branch when there is one, so images already
          # waiting for a scheduled slot survive.
          if git fetch --depth=1 origin media 2>/dev/null; then
            git checkout -q FETCH_HEAD
            git checkout -qb media
          else
            git checkout -qb media
          fi

          # The branch carries staged images and nothing else. An earlier
          # version of this workflow committed post.jpg and __pycache__ onto it
          # by mistake; this clears them out for good.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'post-*.jpg' -exec rm -rf {} +

          cp "$WORK/../$MEDIA_NAME" "./$MEDIA_NAME"

          # Keep the branch bounded. Filenames start with the Apps Script key,
          # which is an epoch timestamp, so a plain sort is chronological —
          # mtime would not work here, since checkout stamps everything now.
          ls -1 post-*.jpg 2>/dev/null | sort | head -n -60 | xargs -r rm -f

          git add -A
          git commit -q -m "stage $MEDIA_NAME" || echo "nothing to commit"
          git push -q origin HEAD:media

          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/media/${MEDIA_NAME}" >> $GITHUB_OUTPUT

      - name: Send the picture back for approval
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_URL: ${{ steps.stage.outputs.url }}
          # The buttons under the picture route taps back to this confession.
          KEY: ${{ github.event.client_payload.key }}
          APPROVER: ${{ github.event.client_payload.approver }}
          EDITED: ${{ github.event.client_payload.edited }}
          SIZE: ${{ steps.render.outputs.size }}
          LINES: ${{ steps.render.outputs.lines }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          STAGE_RESULT: ${{ steps.stage.outcome }}
        run: python3 report.py
