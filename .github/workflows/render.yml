name: render confession

# Fired by Apps Script the instant someone taps ✅ in Telegram.
on:
  repository_dispatch:
    types: [render]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFESSION_TEXT: ${{ github.event.client_payload.text }}
          APPROVER: ${{ github.event.client_payload.approver }}
          EDITED: ${{ github.event.client_payload.edited }}
        run: python3 render_and_send.py
